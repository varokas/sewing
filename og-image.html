<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #faf7f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #3a3733;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .top-rule {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: #b8434e;
  }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 0 80px;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  h1 {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    color: #3a3733;
  }

  .sub {
    font-size: 22px;
    color: #79736a;
    text-align: center;
    max-width: 740px;
    line-height: 1.55;
  }

  .icons {
    display: flex;
    gap: 28px;
    align-items: flex-end;
    margin-top: 4px;
  }

  .icon-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .icon-label {
    font-size: 11px;
    color: #79736a;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .fab    { fill: #8fa9c9; stroke: #5e7f9e; stroke-width: 1.5; }
  .fabd   { fill: #7e9cba; stroke: #5e7f9e; stroke-width: 1.5; }
  .fabws  { fill: #dde6ef; stroke: #8fa3b8; stroke-width: 1.5; }
  .stitch { fill: none; stroke: #b8434e; stroke-width: 1.6; stroke-dasharray: 6 4; }
  .serge  { fill: none; stroke: #6f9b6f; stroke-width: 1.4; }

  .url {
    position: absolute;
    bottom: 26px;
    right: 44px;
    font-size: 14px;
    color: #b0a89e;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="top-rule"></div>

  <div class="wrap">
    <div class="logo-row">
      <svg width="44" height="44" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="10" cy="10" r="8" fill="none" stroke="#b8434e" stroke-width="2"/>
        <circle cx="7"  cy="7.5"  r="1.3" fill="#b8434e"/>
        <circle cx="13" cy="7.5"  r="1.3" fill="#b8434e"/>
        <circle cx="7"  cy="12.5" r="1.3" fill="#b8434e"/>
        <circle cx="13" cy="12.5" r="1.3" fill="#b8434e"/>
      </svg>
      <h1>Sewing Manual</h1>
    </div>

    <p class="sub">A garment-assembly manual for hobbyist sewists — fabric choice, assembly order, and techniques for every garment type.</p>

    <div class="icons">

      <!-- Tops -->
      <div class="icon-wrap">
        <svg width="72" height="72" viewBox="0 0 84 84">
          <path class="fabws" d="M26 14 L37 9 L42 16 L47 9 L58 14 L68 26 L60 34 L56 29 L56 68 L28 68 L28 29 L24 34 L16 26 Z"/>
          <path d="M37 9 L42 18 L47 9" fill="none" stroke="#8fa3b8" stroke-width="1.5"/>
          <path d="M42 18 L42 66" stroke="#8fa3b8" stroke-width="1"/>
          <circle cx="42" cy="28" r="1.4" fill="#8fa3b8"/>
          <circle cx="42" cy="40" r="1.4" fill="#8fa3b8"/>
          <circle cx="42" cy="52" r="1.4" fill="#8fa3b8"/>
          <circle cx="42" cy="62" r="1.4" fill="#8fa3b8"/>
        </svg>
        <span class="icon-label">Tops</span>
      </div>

      <!-- Dresses -->
      <div class="icon-wrap">
        <svg width="72" height="72" viewBox="0 0 84 84">
          <path class="fab" d="M28 10 L36 7 Q42 16 48 7 L56 10 Q52 22 53 30 L64 72 Q42 79 20 72 L31 30 Q32 22 28 10 Z"/>
          <path class="stitch" d="M32 31 Q42 35 52 31"/>
        </svg>
        <span class="icon-label">Dresses</span>
      </div>

      <!-- Pants -->
      <div class="icon-wrap">
        <svg width="72" height="72" viewBox="0 0 84 84">
          <path class="fabws" d="M29 10 L55 10 L61 72 L46 72 L42 38 L38 72 L23 72 Z"/>
          <path d="M29.7 17 L54.7 17" stroke="#8fa3b8" stroke-width="1.2" fill="none"/>
          <path d="M42 17 Q46 22 44 30" fill="none" stroke="#8fa3b8" stroke-width="1.2" stroke-dasharray="3 2"/>
        </svg>
        <span class="icon-label">Pants</span>
      </div>

      <!-- Skirts -->
      <div class="icon-wrap">
        <svg width="72" height="72" viewBox="0 0 84 84">
          <rect class="fab" x="29" y="10" width="26" height="8" rx="1.5"/>
          <path class="fab" d="M30 18 L54 18 L67 70 Q42 78 17 70 Z"/>
          <path class="stitch" d="M22 66 Q42 73 62 66"/>
        </svg>
        <span class="icon-label">Skirts</span>
      </div>

      <!-- Jackets -->
      <div class="icon-wrap">
        <svg width="72" height="72" viewBox="0 0 84 84">
          <path class="fab" d="M24 16 L36 10 L42 20 L48 10 L60 16 L68 30 L61 36 L58 31 L58 70 L26 70 L26 31 L23 36 L16 30 Z"/>
          <path d="M42 20 L37 70 M42 20 L47 70" fill="none" stroke="#5e7f9e" stroke-width="1.2"/>
          <path d="M36 10 L42 20 L37 25 L32 14 Z" fill="#7e9cba" stroke="#5e7f9e" stroke-width="1"/>
          <path d="M48 10 L42 20 L47 25 L52 14 Z" fill="#7e9cba" stroke="#5e7f9e" stroke-width="1"/>
        </svg>
        <span class="icon-label">Jackets</span>
      </div>

      <!-- Knits -->
      <div class="icon-wrap">
        <svg width="72" height="72" viewBox="0 0 84 84">
          <path class="fabws" d="M26 14 L36 9 Q42 17 48 9 L58 14 L68 26 L60 34 L56 29 L56 68 L28 68 L28 29 L24 34 L16 26 Z"/>
          <path d="M37 11 Q42 20 47 11" fill="none" stroke="#8fa3b8" stroke-width="1.5"/>
          <path class="serge" d="M30 64 l3 -3 l3 3 l3 -3 l3 3 l3 -3 l3 3 l3 -3 l3 3"/>
        </svg>
        <span class="icon-label">Knits</span>
      </div>

    </div>
  </div>

  <span class="url">varokas.github.io/sewing</span>
</body>
</html>
